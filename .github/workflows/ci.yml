name: Build via EESSI and EasyBuild on x86 and Arm
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:  # Allows manual triggering
  push:
  pull_request:
    branches:
      - main
# Declare default permissions as read only.
permissions: read-all
jobs:
  minimal_usage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Load EESSI
      uses: eessi/github-action-eessi@v3
      with:
        eessi_stack_version: '2026.06'
    - name: Restore MPI/GCC cache
      id: cache-mpi-gcc
      uses: actions/cache/restore@v6
      with:
        path: /home/runner/work/mpi/eessi
        key: mpich-gcc-${{ matrix.os }}-0.1.0-dev-${{ github.sha }}
        restore-keys: |
          mpich-gcc-${{ matrix.os }}-0.1.0-dev-
    - name: Install MPI runtimes
      id: mpi-needed
      shell: bash
      run: |
        export EESSI_PROJECT_INSTALL="/home/runner/work/mpi/eessi"
        export EASYBUILD_SOURCEPATH="/home/runner/work/mpi/eessi/sources"
        mkdir -p $EESSI_PROJECT_INSTALL
        module load EESSI-extend
        cd easybuild
        
        # Let's check if anything is missing.
        echo ""
        echo "DEBUGGING: eb --missing *MPI*-mpif.eb"

        EB_MISSING=$(eb --missing *MPI*-mpif.eb 2>&1)
        EB_STATUS=$?

        if echo "$EB_MISSING" | grep -qF "No missing modules"; then
          echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          echo ""
          echo "No need to run EasyBuild installation steps"
        else
          echo ""
          echo "Installing missing MPI installations via EasyBuild"
          echo ""

          # Grab the source files first
          eb --fetch *MPI*-mpif.eb

          # Then run the two builds in parallel
          # (with and without mpif)
          eb --robot MPICH-*-mpif.eb &
          pid1=$!

          # OpenMPI easyblock is not yet ready for OpenMPI6, custom easyblock works around that
          eb --robot --include-easyblocks=./openmpi.py OpenMPI-*-mpif.eb &
          pid2=$!

          wait $pid1 || exit 1
          wait $pid2 || exit 1

          # If we got to here our cache has changed
          echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Cache will be updated"
        fi

    - name: Save MPI/GCC cache
      if: |
        github.ref == 'refs/heads/main' &&
        success() &&
        steps.mpi-needed.outputs.cache_changed == 'true'
      uses: actions/cache/save@v6
      with:
        path: /home/runner/work/mpi/eessi
        key: mpi-gcc-${{ matrix.os }}-0.1.0-dev-${{ github.sha }}
    - name: Test traMPI via EESSI-extend
      shell: bash
      run: |
        export EESSI_PROJECT_INSTALL="/home/runner/work/mpi/eessi"
        export EESSI_USER_INSTALL="/home/runner/work/eessi"
        mkdir -p $EESSI_USER_INSTALL
        module load EESSI-extend
        unset EASYBUILD_DEBUG
        if ! eb --software-commit="$GITHUB_SHA" easybuild/traMPI-devel-GCC-15.2.0.eb; then
          echo
          echo "EasyBuild failed. Last log:"
          echo
          cat "$(eb --last-log)"
          exit 1
        fi
        echo
        echo "Check we can load the module:"
        echo
        module load traMPI
        module list
        echo ""
        echo "Check the mpicc compiler works:"
        echo ""
        mpicc -show
        mpicc -Werror -Wl,--fatal-warnings test_codes/mpi_hello_world.c
        echo ""
        echo "Check how the executable is linked:"
        echo ""
        ldd ./a.out
        echo ""
        echo "Check we can also run things:"
        echo ""
        LD_LIBRARY_PATH=$EBROOTTRAMPI/lib mpiexec -n 2 ./a.out
        echo ""
        echo "Check the mpifort compiler works (with '-Werror -Wl,--fatal-warnings' ):"
        echo ""
        mpifort -show test_codes/mpi_hello_world.f90
        mpifort -Werror -Wl,--fatal-warnings test_codes/mpi_hello_world.f90
        echo ""
        echo "Check how the executable is linked:"
        echo ""
        ldd ./a.out
        echo ""
        echo "Check we can also run fortran codes:"
        echo ""
        LD_LIBRARY_PATH=$EBROOTTRAMPI/lib mpirun -n 2 ./a.out
        echo ""
        echo "Check what verbose output looks like by setting TRAMPI_ABI_LIBRARY_VERBOSE:"
        echo ""
        TRAMPI_ABI_LIBRARY_VERBOSE=1 LD_LIBRARY_PATH=$EBROOTTRAMPI/lib mpirun -n 2 ./a.out
        echo ""
        echo "Check what verbose output looks like when changing the backend ABI library:"
        echo "(must use C here as that is what the backend supports in this case)"
        echo ""
        mpicc -Werror -Wl,--fatal-warnings test_codes/mpi_hello_world.c
        module load OpenMPI
        echo ""
        echo "Exporting TRAMPI_ABI_LIBRARY=$EBROOTOPENMPI/lib/libmpi_abi.so"
        export TRAMPI_ABI_LIBRARY="$EBROOTOPENMPI/lib/libmpi_abi.so"
        echo "Exporting TRAMPI_ABI_LIBRARY_MPIEXEC=$EBROOTOPENMPI/bin/mpiexec"
        export TRAMPI_ABI_LIBRARY_MPIEXEC="$EBROOTOPENMPI/bin/mpiexec"
        echo "Exporting TRAMPI_FORCE_DLOPEN=1 OMPI_MCA_btl=tcp,self OMPI_MCA_btl_tcp_if_include=eth0 OMPI_MCA_osc=^ucx"
        export TRAMPI_FORCE_DLOPEN=1 OMPI_MCA_btl=tcp,self OMPI_MCA_btl_tcp_if_include=eth0 OMPI_MCA_osc=^ucx 
        module unload OpenMPI
        echo ""
        echo "Running:"
        echo " TRAMPI_ABI_LIBRARY_VERBOSE=1 LD_LIBRARY_PATH=$EBROOTTRAMPI/lib mpirun -n 2 ./a.out"
        echo ""
        TRAMPI_ABI_LIBRARY_VERBOSE=1 LD_LIBRARY_PATH=$EBROOTTRAMPI/lib mpirun -n 2 ./a.out
